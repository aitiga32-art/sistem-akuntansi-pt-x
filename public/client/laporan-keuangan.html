<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/app/assets/client/client-portal.css?v=pt-x-local-3">
  <title>Laporan Keuangan - Client Portal</title>
</head>
<body class="client-portal-app">
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="portal-logo">
        <span class="portal-brand-mark" aria-hidden="true">X</span>
        <div>
          <p class="portal-client-name">Client Portal</p>
          <p class="portal-client-meta" id="financialReportClientMeta">Memuat data klien...</p>
        </div>
      </div>

      <nav class="portal-nav" aria-label="Navigasi client portal">
        <a href="/app/client">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5h5v5"/></svg>
          <span>Beranda</span>
        </a>
        <a href="/app/client/dashboard">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
          <span>Portal Saya</span>
        </a>
        <a class="admin-only" href="/app/client/access-users" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
          <span>Akses User</span>
        </a>
      </nav>

      <div class="portal-sidebar-footer">
        <div class="portal-user">
          <strong id="financialReportUserName">-</strong>
          <span id="financialReportUserEmail">-</span>
        </div>
        <button class="danger-button" type="button" id="clientLogoutBtn">Logout</button>
      </div>
    </aside>

    <main class="portal-main">
      <div id="financialReportAlert" class="portal-alert" hidden></div>

      <header class="portal-topbar">
        <div>
          <a class="portal-back-link" id="financialReportBackLink" href="/app/client">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span>Menu Klien</span>
          </a>
          <h1 class="portal-title" id="financialReportTitle">Laporan Keuangan</h1>
          <p class="portal-subtitle" id="financialReportSubtitle">Memuat laporan...</p>
        </div>
        <div class="financial-report-action-buttons">
          <button class="portal-refresh financial-report-action-button" type="button" id="financialReportDownloadBtn">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
            <span>Download</span>
          </button>
          <button class="portal-refresh financial-report-action-button" type="button" id="financialReportPrintBtn">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
            <span>Print</span>
          </button>
          <button class="portal-refresh" type="button" id="financialReportRefreshBtn">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.39 6.36L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.39 5.64L21 8"/><path d="M21 3v5h-5"/></svg>
            <span>Refresh</span>
          </button>
        </div>
      </header>

      <section class="financial-report-controls" id="financialReportControls" hidden>
        <label>
          <span>Tahun</span>
          <input type="number" id="financialReportYearInput" min="2000" max="2100" step="1">
        </label>
        <label>
          <span>Periode Awal</span>
          <select id="financialReportPeriodStartSelect"></select>
        </label>
        <label>
          <span>Periode Akhir</span>
          <select id="financialReportPeriodEndSelect"></select>
        </label>
      </section>

      <section class="financial-report-sheet" id="financialReportSheet" aria-live="polite">
        <div class="empty-state">Memuat laporan keuangan...</div>
      </section>

      <div class="portal-modal-backdrop financial-report-detail-modal" id="financialReportDetailModal" hidden>
        <div class="portal-modal portal-modal-wide" role="dialog" aria-modal="true" aria-labelledby="financialReportDetailTitle">
          <header class="portal-modal-header">
            <div>
              <h2 id="financialReportDetailTitle">Rincian Laporan</h2>
              <span id="financialReportDetailSubtitle">-</span>
            </div>
            <button class="icon-button" type="button" id="financialReportDetailClose" aria-label="Tutup">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </header>
          <div class="financial-report-detail-body" id="financialReportDetailBody"></div>
          <footer class="portal-modal-footer">
            <button class="ghost-button" type="button" id="financialReportDetailDone">Tutup</button>
          </footer>
        </div>
      </div>

      <div class="portal-modal-backdrop" id="fiscalCorrectionModal" hidden>
        <section class="portal-modal" role="dialog" aria-modal="true" aria-labelledby="fiscalCorrectionModalTitle">
          <form id="fiscalCorrectionForm">
            <header class="portal-modal-header">
              <div>
                <h2 id="fiscalCorrectionModalTitle">Tambah Koreksi Fiskal</h2>
                <span>Isi koreksi positif atau negatif untuk Perhitungan Pajak.</span>
              </div>
              <button class="icon-button" type="button" id="fiscalCorrectionCloseBtn" aria-label="Tutup popup">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </header>
            <div class="cashbook-form-grid">
              <label class="form-field">
                <span>Jenis Koreksi</span>
                <select id="fiscalCorrectionType" required>
                  <option value="positive">Koreksi Positif</option>
                  <option value="negative">Koreksi Negatif</option>
                </select>
              </label>
              <label class="form-field">
                <span>Nominal</span>
                <input id="fiscalCorrectionAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" required>
              </label>
              <label class="form-field full">
                <span>Keterangan</span>
                <input id="fiscalCorrectionDescription" type="text" autocomplete="off" placeholder="Contoh: Biaya yang tidak dapat dikurangkan" required>
              </label>
            </div>
            <footer class="portal-modal-footer">
              <button class="ghost-button" type="button" id="fiscalCorrectionCancelBtn">Batal</button>
              <button class="submit modal-submit" type="submit" id="fiscalCorrectionSaveBtn">Simpan</button>
            </footer>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="/app/assets/client/client-period.js?v=pt-x-local-3" defer></script>
  <script src="/app/assets/client/laporan-keuangan.js?v=pt-x-local-3" defer></script>
  <script src="/app/assets/client/client-book-nav.js?v=pt-x-local-3" defer></script>
</body>
</html>
