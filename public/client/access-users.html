<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/app/assets/client/client-portal.css?v=pt-x-local-3">
  <title>Akses User Client Portal - PT X</title>
</head>
<body class="client-portal-app">
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="portal-logo">
        <span class="portal-brand-mark" aria-hidden="true">X</span>
        <div>
          <p class="portal-client-name">Client Portal</p>
          <p class="portal-client-meta" id="accessClientMeta">Akses User</p>
        </div>
      </div>

      <nav class="portal-nav" aria-label="Navigasi client portal">
        <a href="/app/client">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5h5v5"/></svg>
          <span>Beranda</span>
        </a>
        <a href="/app/client/dashboard">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
          <span>Portal Saya</span>
        </a>
        <a class="active" href="/app/client/access-users">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
          <span>Akses User</span>
        </a>
      </nav>

      <div class="portal-sidebar-footer">
        <div class="portal-user">
          <strong id="accessUserName">-</strong>
          <span id="accessUserEmail">-</span>
        </div>
        <button class="danger-button" type="button" id="clientLogoutBtn">Logout</button>
      </div>
    </aside>

    <main class="portal-main">
      <div id="accessAlert" class="portal-alert" hidden></div>

      <header class="portal-topbar">
        <div>
          <h1 class="portal-title">Akses User</h1>
          <p class="portal-subtitle">Buat login Client Portal per klien berdasarkan Data Klien.</p>
        </div>
        <button class="portal-refresh" type="button" id="accessRefreshBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.39 6.36L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.39 5.64L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Refresh</span>
        </button>
      </header>

      <div class="access-grid">
        <section class="panel" aria-labelledby="accessFormTitle">
          <div class="panel-header">
            <h2 id="accessFormTitle">Buat Login Klien</h2>
            <span>Client Portal</span>
          </div>
          <div class="panel-body">
            <form class="access-form" id="accessUserForm">
              <div class="form-field full">
                <label for="accessClientSelect">Pilih Klien</label>
                <select id="accessClientSelect" name="clientId" required>
                  <option value="">Memuat klien...</option>
                </select>
              </div>

              <div class="client-picked-summary" id="accessClientSummary">
                <div class="empty-state">Pilih klien dari Data Klien untuk mengisi profil akses.</div>
              </div>

              <div class="form-field">
                <label for="accessUsername">Username</label>
                <input id="accessUsername" name="username" autocomplete="off" required>
              </div>
              <div class="form-field">
                <label for="accessEmail">Email Login</label>
                <input id="accessEmail" name="email" type="email" autocomplete="off">
              </div>
              <div class="form-field">
                <label for="accessPassword">Password Baru</label>
                <input id="accessPassword" name="password" type="password" autocomplete="new-password" placeholder="Password baru">
              </div>
              <div class="form-field">
                <label for="accessDisplayName">Nama Tampilan</label>
                <input id="accessDisplayName" name="displayName" autocomplete="off">
              </div>
              <div class="form-field">
                <label for="accessRole">Role</label>
                <select id="accessRole" name="role">
                  <option value="client">Client</option>
                  <option value="admin">Admin Client Portal</option>
                </select>
              </div>
              <div class="form-field">
                <label for="accessBusinessEntity">Akses Entitas</label>
                <select id="accessBusinessEntity" name="businessEntityKey">
                  <option value="">Semua entitas / master</option>
                </select>
              </div>
              <label class="check-field">
                <input id="accessIsActive" name="isActive" type="checkbox" checked>
                <span>Aktif</span>
              </label>

              <button class="submit" type="submit" id="accessSubmitBtn">Simpan Akses</button>
            </form>
          </div>
        </section>

        <section class="panel" aria-labelledby="accessListTitle">
          <div class="panel-header">
            <h2 id="accessListTitle">Akun Portal</h2>
            <span id="accessAccountCount">0 akun</span>
          </div>
          <div class="panel-body">
            <div class="access-account-list" id="accessAccountList">
              <div class="empty-state">Memuat akun portal...</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/app/assets/client/client-access-users.js?v=pt-x-local-3" defer></script>
</body>
</html>
