<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/app/assets/client/client-portal.css?v=pt-x-local-3">
  <title>Buku Besar - Client Portal</title>
</head>
<body class="client-portal-app">
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="portal-logo">
        <span class="portal-brand-mark" aria-hidden="true">X</span>
        <div>
          <p class="portal-client-name">Client Portal</p>
          <p class="portal-client-meta" id="bukuBesarClientMeta">Memuat data klien...</p>
        </div>
      </div>

      <nav class="portal-nav" aria-label="Navigasi client portal">
        <a href="/app/client">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5h5v5"/></svg>
          <span>Beranda</span>
        </a>
        <a href="/app/client/dashboard">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
          <span>Portal Saya</span>
        </a>
        <a class="admin-only" href="/app/client/access-users" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
          <span>Akses User</span>
        </a>
      </nav>

      <div class="portal-sidebar-footer">
        <div class="portal-user">
          <strong id="bukuBesarUserName">-</strong>
          <span id="bukuBesarUserEmail">-</span>
        </div>
        <button class="danger-button" type="button" id="clientLogoutBtn">Logout</button>
      </div>
    </aside>

    <main class="portal-main">
      <div id="bukuBesarAlert" class="portal-alert" hidden></div>

      <header class="portal-topbar">
        <div>
          <a class="portal-back-link" id="bukuBesarBackLink" href="/app/client">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span>Menu Klien</span>
          </a>
          <h1 class="portal-title">Buku Besar</h1>
          <p class="portal-subtitle" id="bukuBesarSubtitle">Memuat data dari menu klien...</p>
        </div>
        <button class="portal-refresh" type="button" id="bukuBesarRefreshBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.39 6.36L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.39 5.64L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Refresh</span>
        </button>
      </header>

      <section class="ledger-summary" aria-label="Ringkasan Buku Besar">
        <div>
          <span>Total Baris</span>
          <strong id="bukuBesarRowCount">0</strong>
        </div>
        <div>
          <span>Total Debit</span>
          <strong id="bukuBesarDebitTotal">0</strong>
        </div>
        <div>
          <span>Total Credit</span>
          <strong id="bukuBesarCreditTotal">0</strong>
        </div>
        <div>
          <span>Sumber</span>
          <strong id="bukuBesarSourceCount">0 menu</strong>
        </div>
      </section>

      <section class="ledger-filterbar" aria-label="Filter Buku Besar">
        <label for="bukuBesarCoaFilter">Filter COA</label>
        <select id="bukuBesarCoaFilter">
          <option value="">Semua COA dan nama akun</option>
        </select>
        <button class="ghost-button ledger-view-journal-button" type="button" id="bukuBesarViewJournalBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
          <span>Lihat Jurnal</span>
        </button>
        <button class="ghost-button ledger-export-button" type="button" id="bukuBesarExportBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Download Excel</span>
        </button>
      </section>

      <section class="cashbook-sheet-panel" aria-label="Tabel Buku Besar">
        <div class="cashbook-table-wrap">
          <table class="cashbook-table ledger-table">
            <thead>
              <tr>
                <th class="client-entity-column">Entitas</th>
                <th>COA</th>
                <th>NAMA AKUN</th>
                <th>TANGGAL</th>
                <th>NO BUKTI</th>
                <th>SUMBER</th>
                <th>KETERANGAN</th>
                <th>DEBIT</th>
                <th>CREDIT</th>
                <th>CATATAN PAJAK</th>
              </tr>
            </thead>
            <tbody id="bukuBesarRows">
              <tr><td colspan="10">Memuat Buku Besar...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/app/assets/client/client-period.js?v=pt-x-local-3" defer></script>
  <script src="/app/assets/vendor/xlsx/xlsx.full.min.js" defer></script>
  <script src="/app/assets/client/buku-besar.js?v=pt-x-local-3" defer></script>
  <script src="/app/assets/client/client-book-nav.js?v=pt-x-local-3" defer></script>
</body>
</html>
