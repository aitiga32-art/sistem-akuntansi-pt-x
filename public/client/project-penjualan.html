<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/app/assets/client/client-portal.css?v=pt-x-local-3">
  <title>Project Penjualan - Client Portal</title>
</head>
<body class="client-portal-app project-sales-page">
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="portal-logo">
        <span class="portal-brand-mark" aria-hidden="true">X</span>
        <div>
          <p class="portal-client-name">Client Portal</p>
          <p class="portal-client-meta" id="projectSalesClientMeta">Memuat data klien...</p>
        </div>
      </div>

      <nav class="portal-nav" aria-label="Navigasi client portal">
        <a href="/app/client">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5h5"/></svg>
          <span>Beranda</span>
        </a>
        <a href="/app/client/dashboard">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
          <span>Portal Saya</span>
        </a>
        <a class="admin-only" href="/app/client/access-users" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
          <span>Akses User</span>
        </a>
      </nav>

      <div class="portal-sidebar-footer">
        <div class="portal-user">
          <strong id="projectSalesUserName">-</strong>
          <span id="projectSalesUserEmail">-</span>
        </div>
        <button class="danger-button" type="button" id="clientLogoutBtn">Logout</button>
      </div>
    </aside>

    <main class="portal-main">
      <div id="projectSalesAlert" class="portal-alert" hidden></div>

      <header class="portal-topbar">
        <div>
          <a class="portal-back-link" id="projectSalesBackLink" href="/app/client">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span>Menu Klien</span>
          </a>
          <h1 class="portal-title">Project Penjualan</h1>
          <p class="portal-subtitle" id="projectSalesSubtitle">Memuat data project...</p>
        </div>
        <button class="portal-refresh" type="button" id="projectSalesRefreshBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.39 6.36L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.39 5.64L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Refresh</span>
        </button>
      </header>

      <section class="project-sales-shell">
        <div class="project-sales-tabs" role="tablist" aria-label="Project Penjualan">
          <button class="project-sales-tab active" type="button" role="tab" aria-selected="true">Rekap Pembelian</button>
        </div>

        <section class="project-sales-panel" aria-label="Rekap Pembelian">
          <div class="panel-header client-menu-heading">
            <div>
              <h2>Rekap Pembelian</h2>
              <span id="projectSalesSheetMeta">0 cell terisi</span>
            </div>
            <div class="project-sales-actions">
              <button class="ghost-button" type="button" id="projectSalesCompactBtn">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 4 4 4-4"/><path d="M12 7V3"/><path d="m8 21 4-4 4 4"/><path d="M12 17v4"/></svg>
                <span>Minimize</span>
              </button>
              <button class="ghost-button" type="button" id="projectSalesEditHeadersBtn">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                <span>Edit Judul Cell</span>
              </button>
              <button class="ghost-button danger-lite" type="button" id="projectSalesClearBtn">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
                <span>Hapus Isi</span>
              </button>
            </div>
          </div>

          <div class="project-sales-sheet-wrap" id="projectSalesSheetWrap">
            <table class="project-sales-sheet" aria-label="Grid Rekap Pembelian">
              <thead id="projectSalesSheetHead"></thead>
              <tbody id="projectSalesSheetBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="/app/assets/client/client-upload-qr.js?v=pt-x-local-3" defer></script>
  <script src="/app/assets/client/project-penjualan.js?v=pt-x-local-3" defer></script>
  <script src="/app/assets/client/client-book-nav.js?v=pt-x-local-3" defer></script>
</body>
</html>
