services:
  - type: web
    name: sistem-akuntansi-proyek-pt-x
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_PORTAL_PUBLIC_DEMO_ACCESS
        value: "true"
      - key: CLIENT_PORTAL_INTERNAL_LOGIN_ENABLED
        value: "false"
      - key: CLIENT_PORTAL_SKIP_SCHEMA_ENSURE
        value: "true"
      - key: CLIENT_PORTAL_SESSION_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: DB_POOL_MAX
        value: "3"

